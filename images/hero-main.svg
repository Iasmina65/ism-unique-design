<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Compoziție de interior editorial, linie aurie pe fond ivoire">
  <rect width="1600" height="1000" fill="#EDE6D8"/>
  <rect width="1600" height="1000" fill="url(#grain)" opacity="0.5"/>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0 0.03  0 0 0 0.02 0"/>
    </filter>
  </defs>
  <!-- horizon / floor line -->
  <line x1="0" y1="760" x2="1600" y2="760" stroke="#14120F" stroke-width="1" opacity="0.15"/>
  <!-- arched window -->
  <path d="M 220 760 L 220 420 A 190 190 0 0 1 600 420 L 600 760" fill="none" stroke="#B08D4F" stroke-width="2"/>
  <path d="M 260 760 L 260 440 A 150 150 0 0 1 560 440 L 560 760" fill="none" stroke="#B08D4F" stroke-width="1" opacity="0.5"/>
  <!-- armchair silhouette -->
  <g stroke="#14120F" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 900 760 L 900 620 Q 900 580 940 580 L 1120 580 Q 1160 580 1160 620 L 1160 760" />
    <path d="M 900 660 L 860 660 L 860 760" />
    <path d="M 1160 660 L 1200 660 L 1200 760" />
    <line x1="880" y1="760" x2="1220" y2="760"/>
    <path d="M 900 620 Q 1030 590 1160 620"/>
  </g>
  <!-- floor lamp -->
  <g stroke="#B08D4F" stroke-width="2" fill="none">
    <line x1="1330" y1="760" x2="1330" y2="480"/>
    <path d="M 1270 480 L 1390 480 L 1370 400 L 1290 400 Z"/>
    <line x1="1300" y1="760" x2="1360" y2="760"/>
  </g>
  <!-- long horizontal shelf line -->
  <line x1="80" y1="300" x2="700" y2="300" stroke="#B08D4F" stroke-width="1" opacity="0.6"/>
  <circle cx="120" cy="300" r="4" fill="#B08D4F"/>
  <circle cx="200" cy="300" r="4" fill="#B08D4F"/>
</svg>
